        - generic [ref=f5e391]:
          - paragraph [ref=f5e393]: Mosaic visualizations can be defined using data, view, and interaction specifications written in a declarative syntax. Our publish-time optimizations focus on YAML-based specifications, which are parsed into an abstract syntax tree (AST). The AST enables static analysis and specification rewriting to reference precomputed assets.
          - paragraph [ref=f5e395]: Mosaic นิยามข้อมูล มุมมอง และปฏิสัมพันธ์ด้วยไวยากรณ์เชิงประกาศ งานนี้เน้นข้อกำหนด YAML ซึ่งแปลงเป็น AST เพื่อวิเคราะห์แบบสถิตและแก้ข้อกำหนดให้อ้างถึงทรัพยากรล่วงหน้า
        - generic [ref=f5e396]:
          - paragraph [ref=f5e398]: Mosaic uses a central coordinator, which manages query execution across multiple clients, typically backed by a DuckDB [22] database. Query execution can occur locally in the browser (via DuckDB-WASM), on a local server, or on a remote database. This flexibility is key to supporting publish-time workflows, as precomputed assets can be generated independently of run-time execution environments using an in-process DuckDB instance.
          - paragraph [ref=f5e400]: Mosaic ใช้ตัวกลางจัดการคิวรีของหลายไคลเอนต์ โดยทั่วไปมี DuckDB [22] เป็นฐานข้อมูล คิวรีทำงานในเบราว์เซอร์ผ่าน DuckDB-WASM บนเซิร์ฟเวอร์ภายใน หรือฐานข้อมูลระยะไกลได้ ความยืดหยุ่นนี้รองรับงานช่วงเผยแพร่ เพราะสร้างทรัพยากรล่วงหน้าด้วย DuckDB แบบ in-process ได้โดยไม่ขึ้นกับสภาพแวดล้อมรันไทม์
