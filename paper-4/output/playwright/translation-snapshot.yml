          - paragraph [ref=f5e501]: Figure 4 further shows that despite removing runtime render cost, pre-rendering still incurs a hydration cost that is nearly equivalent to a full client-side render. Future work might explore finer-grained hydration or schemes to reduce this overhead. Browser loading and network transfer time remains a stable portion of total latency, with any differences being minor compared to the respective latency improvements, showing that the effect of storage cost in these examples was negligible. Table 1 summarizes these effects numerically. Across specifications, dataset sizes, and optimizations, the average publishing time is only 1455.3ms ± 1779.0ms longer than the corresponding unoptimized TTA, making it a reasonable one-time cost.
          - paragraph [ref=f5e503]: Figure 4 แสดงด้วยว่า แม้ภาพล่วงหน้าตัดต้นทุนวาดตอนรันไทม์ แต่ยังมีต้นทุน hydration ใกล้กับการเรนเดอร์เต็มชุดฝั่งไคลเอนต์ งานต่อไปอาจศึกษาวิธี hydration ที่ละเอียดขึ้นหรือกลไกลดต้นทุนนี้ เวลาโหลดเบราว์เซอร์และรับส่งเครือข่ายยังเป็นสัดส่วนค่อนข้างคงที่ ความต่างเล็กเมื่อเทียบกับความหน่วงที่ลดลง จึงเห็นว่าผลของต้นทุนพื้นที่ในตัวอย่างเหล่านี้น้อยมาก Table 1 สรุปผลเป็นตัวเลข ข้ามข้อกำหนด ขนาดข้อมูล และระดับการปรับปรุง เวลาเผยแพร่เฉลี่ยยาวกว่า TTA ของกรณีไม่ปรับปรุงที่สอดคล้องกันเพียง 1455.3 ± 1779.0 ms ซึ่งผู้วิจัยเห็นว่าเป็นต้นทุนครั้งเดียวที่ยอมรับได้
