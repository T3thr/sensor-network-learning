        - generic [ref=f5e427]:
          - paragraph [ref=f5e429]: Interaction Pattern Discovery. A core challenge in publish-time optimization for interactive visualizations is that queries are generated in response to user inputs. Mosaic Publisher addresses this by simulating interaction events during the publish process to ensure that all relevant queries (those that would normally be triggered by filtering, selection, or brushing) are exercised and materialized.
          - paragraph [ref=f5e431]: การค้นหารูปแบบปฏิสัมพันธ์ คิวรีเกิดตอบสนองอินพุต จึงเป็นความท้าทายสำคัญของการปรับปรุงช่วงเผยแพร่ Mosaic Publisher จำลองเหตุการณ์ช่วงเผยแพร่ เพื่อเรียกและเก็บผลคิวรีที่เกี่ยวข้อง ซึ่งตามปกติเกิดจากการกรอง การเลือก หรือการเลือกช่วง
        - generic [ref=f5e432]:
          - paragraph [ref=f5e434]: Transparent vs. Explicit Optimization. In Mosaic, many optimizations can be applied transparently because of the coordinator’s control over query generation and execution. For example, the coordinator’s query cache, which stores the results of previously executed queries, can be pre-populated with initialization queries at publish time and loaded alongside the visualization. Similarly, pre-aggregated materialized views can be pre-computed and loaded into the database upon initialization. The Mosaic coordinator will then automatically use these assets rather than re-compute them. However, when optimizations fundamentally alter data access patterns (i.e., replacing preparation queries with precomputed data), the publisher explicitly rewrites the specification.
          - paragraph [ref=f5e436]: การปรับปรุงแบบไม่แก้ข้อกำหนดเทียบกับแบบแก้โดยตรง Mosaic ใช้หลายกลไกได้โดยไม่เปลี่ยนข้อกำหนด เพราะ Coordinator ควบคุมการสร้างและรันคิวรี เช่น เตรียมแคชคิวรีเริ่มต้นไว้ช่วงเผยแพร่แล้วโหลดพร้อมภาพ และคำนวณผลรวมที่เก็บจริงเพื่อโหลดเข้าฐานข้อมูลตอนเริ่มต้น ตัวกลางใช้ทรัพยากรเหล่านี้แทนคำนวณใหม่อัตโนมัติ แต่หากเปลี่ยนรูปแบบการเข้าถึงข้อมูล เช่น แทนคิวรีเตรียมด้วยข้อมูลสำเร็จรูป Publisher จะต้องแก้ข้อกำหนดโดยตรง
        - generic [ref=f5e437]:
          - paragraph [ref=f5e439]: Balancing Pre-rendering and Interactivity. Pre-rendering reduces initial load times (TTR) but requires hydration steps to enable interactivity (TTA). Mosaic Publisher detects whether a visualization includes active interactors or inputs. For non-interactive views, it emits only pre-rendered web content with no additional runtime logic, reducing both JavaScript and data payloads. For interactive views, it outputs pre-rendered initial states alongside JavaScript code to hydrate the visualizations and enable runtime interactions. Our current hydration approach simply instantiates interactive components through the standard client-side rendering process; we leave more nuanced hydration methods to future work.
          - paragraph [ref=f5e441]: การชั่งน้ำหนักภาพล่วงหน้ากับการโต้ตอบ การวาดล่วงหน้าลด TTR แต่ยังต้อง hydration ก่อนพร้อมโต้ตอบหรือ TTA Mosaic Publisher ตรวจว่าภาพมีตัวโต้ตอบหรืออินพุตทำงานหรือไม่ มุมมองที่ไม่มีการโต้ตอบส่งเฉพาะเนื้อหาเว็บที่วาดแล้ว ไม่มีตรรกะรันไทม์เพิ่มเติม จึงลดทั้ง JavaScript และข้อมูล ส่วนมุมมองโต้ตอบส่งสถานะเริ่มต้นพร้อม JavaScript เพื่อ hydration และทำงานต่อ วิธี hydration ปัจจุบันเพียงเริ่มคอมโพเนนต์ผ่านกระบวนการเรนเดอร์ฝั่งไคลเอนต์ตามปกติ ส่วนวิธีละเอียดกว่านี้เป็นงานในอนาคต
        - generic [ref=f5e442]:
          - paragraph [ref=f5e444]: By leveraging Mosaic’s declarative specifications, coordination mechanisms, and centralized query management, our implementation enables publish-time optimizations to be integrated seamlessly, rewriting specifications where necessary, while preserving the expressiveness and flexibility of the Mosaic system. The Mosaic Publisher implementation is available at anonymized URL.
