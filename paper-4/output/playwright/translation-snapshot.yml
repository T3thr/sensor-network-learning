        - generic [ref=f5e156]:
          - paragraph [ref=f5e158]: Some visualization systems employ optimizations to reduce interactive latency. For example, pre-aggregation via data cubes [8, 10] enables low-latency brushing and linking in systems such as imMens [16], Nanocubes [14], Hashedcubes [21], Falcon [19] and Mosaic [11]. Prefetching can also improve responsiveness. ForeCache [3] predicts user actions to load relevant data tiles, while Khameleon [18] hedges across many possible requests using cost-benefit modeling to determine when and which tiles to load. Meanwhile, VegaFusion [13] and VegaPlus [31] optimize run-time performance by offloading computation to a database server.
          - paragraph [ref=f5e160]: บางระบบลดความหน่วงของการโต้ตอบด้วยการสร้างผลรวมล่วงหน้าใน data cube [8,10] ทำให้การเลือกช่วงและเชื่อมมุมมองตอบสนองเร็วใน imMens [16], Nanocubes [14], Hashedcubes [21], Falcon [19] และ Mosaic [11] การดึงข้อมูลล่วงหน้าช่วยได้เช่นกัน ForeCache [3] คาดการณ์การกระทำเพื่อโหลดไทล์ที่เกี่ยวข้อง ส่วน Khameleon [18] เตรียมรับคำขอหลายทางเลือก โดยใช้แบบจำลองต้นทุนและประโยชน์กำหนดเวลาและไทล์ที่จะโหลด ขณะที่ VegaFusion [13] และ VegaPlus [31] เพิ่มประสิทธิภาพรันไทม์ด้วยการย้ายงานคำนวณไปยังเซิร์ฟเวอร์ฐานข้อมูล
