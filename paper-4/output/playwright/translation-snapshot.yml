          - heading "2.3 Web Publish-Time Optimizations" [level=3] [ref=f5e184]
          - heading "2.3 การปรับปรุงเว็บช่วงเผยแพร่" [level=3] [ref=f5e186]
        - generic [ref=f5e187]:
          - paragraph [ref=f5e189]: The web development community has long embraced publish-time strategies to improve perceived performance, particularly for reducing initial load latency (TTR). Static Site Generation (SSG) pre-renders pages at build time into HTML, CSS, and JavaScript, enabling rapid loading from content delivery network caches [17,29]. For dynamic content, Server-Side Rendering (SSR) generates HTML on-demand per request, often paired with “hydration” to attach interactive client-side behavior [2,24]. Modern web frameworks use SSR to improve “first contentful paint” (FCP), while balancing the cost of request-time rendering [1]. Enhancements like progressive hydration and streaming SSR reduce Time to Interactive (TTI) further by incrementally activating page components [23].
          - paragraph [ref=f5e191]: วงการพัฒนาเว็บใช้กลยุทธ์ช่วงเผยแพร่มานานเพื่อให้รับรู้ว่าระบบเร็วขึ้น โดยเฉพาะการลดความหน่วงโหลดครั้งแรกหรือ TTR การสร้างเว็บไซต์สถิต (SSG) วาดหน้าไว้ตอน build เป็น HTML, CSS และ JavaScript ทำให้โหลดจากแคช CDN ได้เร็ว [17,29] สำหรับเนื้อหาเปลี่ยนแปลง SSR สร้าง HTML ตามคำขอ และมักใช้ hydration เพื่อเชื่อมพฤติกรรมโต้ตอบฝั่งไคลเอนต์ [2,24] เฟรมเวิร์กเว็บสมัยใหม่ใช้ SSR เพื่อปรับเวลาที่เนื้อหาแรกปรากฏ (FCP) โดยชั่งน้ำหนักต้นทุนเรนเดอร์ตอนรับคำขอ [1] การเพิ่ม progressive hydration และ streaming SSR ช่วยลดเวลาจนโต้ตอบได้ (TTI) ด้วยการทยอยเริ่มคอมโพเนนต์ [23]
        - generic [ref=f5e192]:
          - paragraph [ref=f5e194]: While these strategies are common to modern web apps, their systematic application to interactive visualization remains limited. Visualization systems offer new opportunities for publish-time optimizations; unlike general websites they often involve static specifications, patterned queries, and predictable user interactions, making them strong candidates for precomputation. We seek to bridge this gap by characterizing publish-time optimizations for interactive visualizations and evaluating their performance impacts.
          - paragraph [ref=f5e196]: แม้แนวทางเหล่านี้ใช้ทั่วไปในเว็บสมัยใหม่ แต่ยังนำมาใช้กับภาพข้อมูลเชิงโต้ตอบอย่างเป็นระบบไม่มาก ระบบภาพข้อมูลมีโอกาสเพิ่มเติม เพราะมักมีข้อกำหนดคงที่ คิวรีเป็นรูปแบบ และปฏิสัมพันธ์ที่คาดการณ์ได้ ต่างจากเว็บไซต์ทั่วไป จึงเหมาะกับการคำนวณล่วงหน้า ผู้วิจัยเชื่อมช่องว่างนี้โดยจำแนกแนวทางช่วงเผยแพร่และประเมินผลต่อประสิทธิภาพ
