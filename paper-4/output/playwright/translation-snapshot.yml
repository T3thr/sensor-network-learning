          - paragraph [ref=f5e380]: We implement publish-time optimizations in the Mosaic architecture [11], atop declarative specifications of interactive visualizations. Mosaic’s architecture decouples specification logic from data processing by managing query execution through a central coordinator, and provides reactive primitives for linking interactions. This design enables publish-time optimizations to be applied either transparently (by pre-populating cache and database content) or via simple, targeted specification rewrites that reference precomputed assets.
