        - generic [ref=f5e174]:
          - paragraph [ref=f5e176]: For ad-hoc analysis by a dedicated data team, “cold start” performance with no preparation delay is advantageous. Some of the systems above can apply optimizations “on-the-fly” at run-time [11,19]. Others, such as Nanocubes [27] and Kyrix [26], can require lengthy index precomputation. For many web-based dashboards with varied audiences, a publishing delay is acceptable, providing an opportunity for further optimization. We focus on using publish-time optimizations to improve the downstream user experience.
          - paragraph [ref=f5e178]: การวิเคราะห์เฉพาะกิจของทีมข้อมูลได้ประโยชน์จากการเริ่มงานแบบ cold start ที่ไม่ต้องรอเตรียมข้อมูล บางระบบข้างต้นปรับปรุงระหว่างใช้งานได้ [11,19] ส่วนระบบอย่าง Nanocubes [27] และ Kyrix [26] อาจต้องสร้างดัชนีล่วงหน้าเป็นเวลานาน สำหรับแดชบอร์ดบนเว็บที่มีผู้ชมหลากหลาย ความล่าช้าช่วงเผยแพร่อาจยอมรับได้ จึงเปิดโอกาสให้ปรับปรุงเพิ่มเติม งานนี้มุ่งใช้การคำนวณช่วงเผยแพร่เพื่อให้ประสบการณ์การใช้งานปลายทางดีขึ้น
