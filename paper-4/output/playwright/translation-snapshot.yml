        - generic [ref=f5e304]:
          - paragraph [ref=f5e306]: Many scalable visualization methods involve building acceleration structures, including data tiles, indexes, and pre-aggregated views. For example, pre-aggregated materialized views in Falcon [19] and Mosaic [11] group data by both bins and interactive pixels (e.g., capturing possible brush positions) to dramatically improve latency of interactive filtering and re-aggregation. Given knowledge of the possible interactive selections, such pre-aggregations can be pre-computed for the initial visualization state, avoiding potentially costly [11] construction queries at run-time. Pre-computed assets may be transferred at load time, trading construction latency for network latency. A similar approach applies to other acceleration structures such as query caches and indexes.
          - paragraph [ref=f5e308]: วิธีแสดงภาพข้อมูลขนาดใหญ่จำนวนมากสร้างโครงสร้างเร่งการคำนวณ เช่น ไทล์ข้อมูล ดัชนี และผลรวมล่วงหน้า ตัวอย่างเช่น Falcon [19] และ Mosaic [11] เก็บผลรวมที่จัดกลุ่มตามทั้ง bin และพิกเซลสำหรับการโต้ตอบ เพื่อครอบคลุมตำแหน่งเลือกช่วงที่เป็นไปได้และลดความหน่วงของการกรองกับการรวมกลุ่มใหม่ เมื่อทราบการเลือกที่เป็นไปได้ สามารถคำนวณผลรวมสำหรับสถานะเริ่มต้นไว้ก่อน แทนสร้างด้วยคิวรีที่อาจแพงตอนรันไทม์ [11] ทรัพยากรเหล่านี้ส่งตอนโหลดได้ จึงแลกเวลาสร้างกับเวลารับส่ง แนวทางคล้ายกันใช้กับแคชผลคิวรีและดัชนีได้
        - generic [ref=f5e309]:
          - paragraph [ref=f5e311]: These optimizations can significantly improve TTA when load time is less than construction time. For pre-aggregation and related tiling methods, the impact on SC scales with the number of aggregation dimensions and resolution levels, as the number of assets can grow combinatorially across multi-view interactions. Overly aggressive pre-computation may yield high storage overhead with limited benefit if pre-computed assets remain unused. These diminishing returns suggest that pre-aggregation will be best applied when interaction spaces are constrained or when applied selectively to the most commonly used and/or latency sensitive interactions.
