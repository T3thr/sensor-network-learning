        - generic [ref=f5e138]:
          - heading "2.1 Latency in Interactive Visualizations" [level=3] [ref=f5e140]
          - heading "2.1 ความหน่วงในภาพข้อมูลเชิงโต้ตอบ" [level=3] [ref=f5e142]
        - generic [ref=f5e143]:
          - paragraph [ref=f5e145]: HCI research highlights the importance of minimizing interface latency. Delays over 100ms can disrupt cognitive flow, as even small latencies affect user interaction strategies [7, 9, 12]. In the context of exploratory visual analysis, Liu and Heer [15] show that interaction delays above 500ms lead to significantly fewer interactions, slower task completion, and reduced insight generation. Similar work in web development echoes these concerns, showing that load and interaction latencies as small as 100ms can lead to a 1% sales loss for Amazon and a 250ms decrease in latency is considered a competitive advantage [25]. Furthermore, in a web context latency has been shown to directly affect user attitude and behavior [5, 20], highlighting its importance. As a whole, these findings underscore the need for optimizations that target interaction latency and load times (TTR, TTA), as all can impact analysis outcomes.
          - paragraph [ref=f5e147]: งานด้านปฏิสัมพันธ์ระหว่างมนุษย์กับคอมพิวเตอร์เน้นการลดความหน่วงของส่วนติดต่อ ความล่าช้าเกิน 100 ms อาจขัดจังหวะการคิด และความหน่วงเล็กน้อยยังเปลี่ยนกลยุทธ์การใช้งานได้ [7,9,12] ในการวิเคราะห์ภาพข้อมูลเชิงสำรวจ Liu และ Heer [15] พบว่าความหน่วงเกิน 500 ms ทำให้การโต้ตอบลดลงอย่างมาก ทำงานสำเร็จช้าลง และค้นพบข้อสังเกตน้อยลง งานพัฒนาเว็บรายงานคล้ายกันว่าเวลาโหลดและเวลาโต้ตอบที่เพิ่มเพียง 100 ms อาจทำให้ยอดขาย Amazon ลด 1% และการลดความหน่วง 250 ms ถือเป็นข้อได้เปรียบในการแข่งขัน [25] ความหน่วงบนเว็บยังส่งผลโดยตรงต่อทัศนคติและพฤติกรรม [5,20] ผลเหล่านี้สนับสนุนการปรับปรุงทั้งความหน่วงการโต้ตอบและเวลาเริ่มโหลด TTR/TTA เพราะทั้งหมดมีผลต่อการวิเคราะห์
