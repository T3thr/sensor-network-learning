        - generic [ref=f5e107]:
          - paragraph [ref=f5e109]: Maintaining low latency in interactive visualizations is essential for supporting analysis and engagement; however, providing responsive performance in web-based visualization systems remains difficult [4,30]. Even small delays can interrupt cognitive flow, reducing user engagement and insight generation [9,12,15]. Prior work [11,13,14, 16, 18, 19, 30] has improved interaction latency using optimizations such as caching, prefetching, indexing, and pre-aggregation. These techniques may involve run-time or publish-time computation, but have not directly addressed initial rendering latency.
          - paragraph [ref=f5e111]: การรักษาความหน่วงต่ำในภาพข้อมูลเชิงโต้ตอบจำเป็นต่อการวิเคราะห์และการมีส่วนร่วม แต่ระบบบนเว็บยังให้การตอบสนองที่รวดเร็วได้ยาก [4,30] ความล่าช้าแม้เพียงเล็กน้อยอาจขัดจังหวะการคิด ลดการมีส่วนร่วมและการค้นพบข้อสังเกต [9,12,15] งานก่อนหน้า [11,13,14,16,18,19,30] ลดความหน่วงของการโต้ตอบด้วยแคช การดึงข้อมูลล่วงหน้า ดัชนี และผลรวมล่วงหน้า เทคนิคเหล่านี้อาจคำนวณตอนรันไทม์หรือช่วงเผยแพร่ แต่ยังไม่ได้มุ่งแก้ความหน่วงของการวาดภาพครั้งแรกโดยตรง
        - generic [ref=f5e112]:
          - paragraph [ref=f5e114]: "Publish-time optimizations shift computational work from run-time to deployment time. In so doing, they can reduce both initial load and interaction latency, while enabling reuse of precomputed assets across multiple user sessions. In web development, publish-time optimizations such as server-side rendering (SSR) are popular for reducing page load latency [24, 28, 29]. Drawing inspiration from these techniques, we explore publish-time optimizations for interactive visualization such as data preparation, pre-computation of data assets for optimization, and pre-rendering. To characterize the space of publish-time optimization techniques for data visualization, we focus on three key metrics: time-to-render (TTR) (the time until visualization content becomes visible), time-to-activation (TTA) (the time until the system is ready to respond to user input), and storage cost (SC) (the size of all deployed assets)."
          - paragraph [ref=f5e116]: การปรับปรุงช่วงเผยแพร่ย้ายงานคำนวณจากตอนใช้งานไปช่วงนำระบบขึ้นเผยแพร่ จึงลดได้ทั้งความหน่วงเริ่มต้นและความหน่วงของการโต้ตอบ พร้อมใช้ทรัพยากรที่คำนวณแล้วซ้ำข้ามหลายเซสชัน ในการพัฒนาเว็บ แนวทางอย่างการเรนเดอร์ฝั่งเซิร์ฟเวอร์ (SSR) นิยมใช้เพื่อลดความหน่วงการโหลดหน้า [24,28,29] จากแนวคิดนี้ ผู้วิจัยศึกษาการเตรียมข้อมูล การคำนวณทรัพยากรข้อมูลล่วงหน้า และการวาดภาพล่วงหน้าสำหรับภาพข้อมูลเชิงโต้ตอบ โดยใช้ตัวชี้วัดหลักสามตัว คือ TTR เวลาจนเนื้อหาภาพข้อมูลมองเห็นได้ TTA เวลาจนระบบพร้อมรับอินพุต และ SC ขนาดทรัพยากรทั้งหมดที่นำไปเผยแพร่
        - generic [ref=f5e117]:
          - paragraph [ref=f5e119]: We implement publish-time optimizations in the open-source Mosaic architecture [11], and analyze trade-offs between the three metrics across different optimizations, dataset sizes, and visualizations. Our evaluation shows significant improvements in both initial rendering and interaction latencies across multiple dashboard types and dataset sizes, with average reductions of 83.7% and 33.3%, respectively (Table 1). Our methods and evaluation results provide visualization developers with strategies and guidance to address the persistent challenge of visualization performance.
          - paragraph [ref=f5e121]: ผู้วิจัยนำแนวทางไปใช้ในสถาปัตยกรรมโอเพนซอร์ส Mosaic [11] และวิเคราะห์การชั่งน้ำหนักระหว่างตัวชี้วัดทั้งสามเมื่อเปลี่ยนวิธีปรับปรุง ขนาดข้อมูล และรูปแบบภาพ ผลประเมินแสดงการลดความหน่วงเริ่มแสดงภาพและก่อนโต้ตอบในแดชบอร์ดหลายประเภทและข้อมูลหลายขนาด โดยลดเฉลี่ย 83.7% และ 33.3% ตามลำดับ (Table 1) วิธีการและผลทดลองให้แนวทางแก่ผู้พัฒนาภาพข้อมูลเพื่อแก้ปัญหาประสิทธิภาพที่ยังพบต่อเนื่อง
