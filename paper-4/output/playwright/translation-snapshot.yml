        - generic [ref=f5e517]:
          - paragraph [ref=f5e519]: In this paper, we characterize and evaluate publish-time optimization strategies for interactive visualization systems, offering a complementary approach to run-time optimizations. Using a framework centered on three key metrics (time-to-render, time-to-activation, and storage cost), we then can reason about the trade-offs inherent to these optimizations. We integrate these strategies into the Mosaic architecture, demonstrating their feasibility in real-world systems and enabling substantial latency reductions through data preparation, pre-computation of data assets for optimization, and pre-rendering.
          - paragraph [ref=f5e521]: บทความจำแนกและประเมินการปรับปรุงช่วงเผยแพร่สำหรับภาพข้อมูลเชิงโต้ตอบ ซึ่งใช้เสริมการปรับปรุงตอนรันไทม์ กรอบตัวชี้วัด TTR, TTA และ SC ช่วยอธิบายการชั่งน้ำหนักของแต่ละแนวทาง ผู้วิจัยรวมกลยุทธ์ใน Mosaic แสดงความเป็นไปได้ในระบบจริงและลดความหน่วงได้มากผ่านการเตรียมข้อมูล การคำนวณทรัพยากรล่วงหน้า และการวาดภาพล่วงหน้า
        - generic [ref=f5e522]:
          - paragraph [ref=f5e524]: Our findings suggest untapped potential for publish-time optimizations, especially for visualizations with stable data and pre-dictable interaction patterns. Future work might look at expanding the space of optimizations, drawing further inspiration from web applications by exploring options such as hybrid publish/runtime strategies or incremental regeneration. Another avenue for future work is to develop methods for automatically selecting effective optimization configurations based on input data and visualization specifications. By characterizing and demonstrating these techniques, we hope to inspire further adoption of publish-time approaches in visualization system design, improving responsiveness and scalability for widely-deployed visualization applications.
          - paragraph [ref=f5e526]: ผลชี้ว่าการปรับปรุงช่วงเผยแพร่ยังมีโอกาสที่ไม่ได้ใช้ โดยเฉพาะภาพที่ข้อมูลคงที่และรูปแบบปฏิสัมพันธ์คาดการณ์ได้ งานต่อไปอาจขยายแนวทางโดยเรียนรู้จากเว็บ เช่น ผสานช่วงเผยแพร่กับรันไทม์ หรือสร้างทรัพยากรใหม่เฉพาะส่วน อีกทิศทางคือพัฒนาวิธีเลือกระดับการปรับปรุงที่ได้ผลจากข้อมูลนำเข้าและข้อกำหนดภาพโดยอัตโนมัติ การจำแนกและแสดงวิธีเหล่านี้มีเป้าหมายสนับสนุนการใช้กลยุทธ์ช่วงเผยแพร่ในการออกแบบระบบภาพข้อมูล เพื่อเพิ่มการตอบสนองและความสามารถขยายขนาดของแอปพลิเคชันที่เผยแพร่ในวงกว้าง
