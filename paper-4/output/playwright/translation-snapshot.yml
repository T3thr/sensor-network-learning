          - heading "3 Publish-Time Optimization Strategies" [level=2] [ref=f5e202]
          - heading "3 กลยุทธ์การปรับปรุงช่วงเผยแพร่" [level=2] [ref=f5e204]
        - generic [ref=f5e205]:
          - paragraph [ref=f5e207]: "The structured nature of interactive visualizations and the regularity of user interaction patterns create natural opportunities for shifting work from run-time to publish-time. By leveraging these characteristics, visualization systems can precompute costly computations improving visualization responsiveness. We group publish-time optimization strategies into three primary categories:"
          - paragraph [ref=f5e209]: ภาพข้อมูลเชิงโต้ตอบมีโครงสร้างชัดเจนและรูปแบบปฏิสัมพันธ์สม่ำเสมอ จึงย้ายงานจากรันไทม์ไปช่วงเผยแพร่ได้ การใช้ลักษณะเหล่านี้ช่วยคำนวณงานที่มีต้นทุนสูงล่วงหน้าเพื่อเพิ่มการตอบสนอง ผู้วิจัยแบ่งแนวทางเป็นสามกลุ่มหลักดังนี้
        - generic [ref=f5e210]:
          - paragraph [ref=f5e212]: "1. Data Preparation and Projection: Transform and reduce data to minimize query costs and the size of input data."
          - paragraph [ref=f5e214]: "1. การเตรียมข้อมูลและเลือกคอลัมน์: แปลงและลดข้อมูลเพื่อลดต้นทุนคิวรีและขนาดข้อมูลนำเข้า"
        - generic [ref=f5e215]:
          - paragraph [ref=f5e217]: "2. Pre-computation of Data Assets for Optimization : Materialize common query results ahead of time and build pre-aggregated materialized views for interaction queries."
          - paragraph [ref=f5e219]: "2. การคำนวณทรัพยากรข้อมูลล่วงหน้าเพื่อเพิ่มประสิทธิภาพ: เก็บผลคิวรีที่ใช้บ่อยไว้ก่อน และสร้างผลรวมที่เก็บจริงสำหรับคิวรีโต้ตอบ"
        - generic [ref=f5e220]:
          - paragraph [ref=f5e222]: "3. Pre-rendering of Visual Outputs: Render visualization states in advance (e.g., as vector or bitmap graphics)."
          - paragraph [ref=f5e224]: "3. การวาดผลภาพล่วงหน้า: สร้างสถานะของภาพข้อมูลไว้ก่อน เช่น กราฟิกเวกเตอร์หรือภาพบิตแมป"
        - generic [ref=f5e225]:
          - paragraph [ref=f5e227]: These categories introduce trade-offs among performance gains, storage/network overhead, and data freshness. The effectiveness of each strategy can vary significantly ( §5) based on the context in which it is being applied, as the trade-offs are conditioned on the characteristics of the visualization(s) being optimized, such as dataset size or the number and type of linked views. For example, initial pre-rendering improves TTR in all cases, whereas data preparation benefits cases where significant transformation or data reduction can be applied up front. Ultimately, the choice of optimization strategy should be guided by a careful consideration of these factors alongside current goals and constraints.
          - paragraph [ref=f5e229]: แนวทางทั้งสามต้องชั่งน้ำหนักประสิทธิภาพที่ดีขึ้นกับต้นทุนพื้นที่ เครือข่าย และความสดของข้อมูล ผลของแต่ละแนวทางอาจต่างกันมากตามบริบท (§5) เพราะขึ้นกับขนาดข้อมูล จำนวนมุมมองที่เชื่อมกัน และชนิดมุมมอง ตัวอย่างเช่น ภาพเริ่มต้นที่วาดล่วงหน้าช่วย TTR ในทุกกรณี ขณะที่การเตรียมข้อมูลได้ประโยชน์เมื่อมีการแปลงหรือลดข้อมูลจำนวนมาก การเลือกกลยุทธ์จึงควรพิจารณาปัจจัยเหล่านี้ร่วมกับเป้าหมายและข้อจำกัดปัจจุบัน
