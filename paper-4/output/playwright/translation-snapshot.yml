          - heading "Abstract" [level=2] [ref=f5e90]
          - heading "บทคัดย่อ" [level=2] [ref=f5e92]
        - paragraph [ref=f5e93]: "ข้อมูลผู้แต่งในต้นฉบับ: Ron Pechuk* · Jeffrey Heer† · University of Washington* rpechuk@uw.edu · † jheer@uw.edu"
        - generic [ref=f5e94]:
          - paragraph [ref=f5e96]: Fast loading and responsive interaction lead to more effective web-based visualizations. While run-time optimizations such as caching and data tiling improve interaction latency, these approaches leave initial load performance unoptimized. In this work, we investigate publish-time optimizations that shift computational work ahead of user sessions to accelerate both loading and interaction. We organize the space of publish-time optimizations into categories of data preparation, pre-computation of data assets for optimization, and pre-rendering; and then reason about tradeoffs in terms of time-to-render (TTR), time-to-activation (TTA), and storage cost (SC). To assess their effectiveness, we implement publish-time optimizations for the open-source Mosaic architecture and evaluate their impact across varied visualizations and dataset sizes. On average, publish-time strategies reduced rendering latency by 83.7% and activation latency by 33.3%, demonstrating their value for improving the performance of web-based visualizations.
          - paragraph [ref=f5e98]: การโหลดที่รวดเร็วและการโต้ตอบที่ตอบสนองดีช่วยให้เว็บแสดงภาพข้อมูลมีประสิทธิผลมากขึ้น แม้การปรับปรุงตอนรันไทม์ เช่น แคชและการแบ่งข้อมูลเป็นไทล์ จะลดความหน่วงของการโต้ตอบได้ แต่ยังไม่ได้ปรับปรุงประสิทธิภาพการโหลดครั้งแรก งานนี้ศึกษาการปรับปรุงช่วงเผยแพร่ที่ย้ายการคำนวณไปทำก่อนเริ่มเซสชัน เพื่อเร่งทั้งการโหลดและการโต้ตอบ ผู้วิจัยจำแนกแนวทางเป็นการเตรียมข้อมูล การคำนวณทรัพยากรข้อมูลล่วงหน้าเพื่อเพิ่มประสิทธิภาพ และการวาดภาพล่วงหน้า แล้วพิจารณาการชั่งน้ำหนักผ่านเวลาจนภาพปรากฏครบถ้วน (TTR) เวลาจนพร้อมรับการโต้ตอบ (TTA) และต้นทุนพื้นที่จัดเก็บ (SC) เพื่อประเมินผล ผู้วิจัยนำแนวทางเหล่านี้ไปใช้กับสถาปัตยกรรมโอเพนซอร์ส Mosaic และทดสอบกับภาพข้อมูลและขนาดข้อมูลที่หลากหลาย โดยเฉลี่ยลดความหน่วงการแสดงภาพได้ 83.7% และลดความหน่วงก่อนพร้อมโต้ตอบได้ 33.3% แสดงถึงประโยชน์ต่อประสิทธิภาพเว็บแสดงภาพข้อมูล
