        - generic [ref=f5e238]:
          - paragraph [ref=f5e240]: "Publish-time optimizations aim to minimize user-perceived latencies without excessive resource costs (or vice versa). We quantify these goals using three key metrics:"
          - paragraph [ref=f5e242]: เป้าหมายคือให้ความหน่วงที่ผู้ใช้งานรับรู้ต่ำที่สุดโดยไม่สิ้นเปลืองทรัพยากรมากเกินไป หรือมองกลับกันให้ใช้ทรัพยากรน้อยภายใต้ข้อกำหนดความหน่วง ผู้วิจัยใช้ตัวชี้วัดสามตัวดังนี้
        - generic [ref=f5e243]:
          - paragraph [ref=f5e245]: "• Time-to-Render (TTR): Time from page request to visual content becoming visible. Akin to FCP in web performance, TTR measures when meaningful content appears onscreen, and can affect engagement [6]. Unlike FCP, TTR specifically measures when the full visualization (not just any page content) is visible, reflecting when analysis can begin."
          - paragraph [ref=f5e247]: "• เวลาจนภาพปรากฏครบถ้วน (TTR): เวลาจากร้องขอหน้าเว็บจนเนื้อหาภาพมองเห็นได้ คล้าย FCP ในการวัดเว็บ โดยสะท้อนเวลาที่เนื้อหามีความหมายปรากฏบนจอและอาจส่งผลต่อการมีส่วนร่วม [6] แต่ TTR วัดเมื่อภาพข้อมูลทั้งหมดปรากฏ ไม่ใช่เพียงเนื้อหาบางส่วนของหน้า จึงสะท้อนเวลาที่เริ่มวิเคราะห์ได้"
        - generic [ref=f5e248]:
          - paragraph [ref=f5e250]: "• Time-to-Activation (TTA): Time until the system is ready to respond to user input (e.g., filtering, zooming, selection). Similar to TTI in web development, TTA measures when page content becomes responsive."
          - paragraph [ref=f5e252]: "• เวลาจนพร้อมรับการโต้ตอบ (TTA): เวลาจนระบบพร้อมตอบอินพุต เช่น กรอง ซูม หรือเลือกข้อมูล คล้าย TTI ในเว็บ โดยวัดว่าเนื้อหาหน้าเริ่มตอบสนองเมื่อใด"
