        - generic [ref=f5e480]:
          - paragraph [ref=f5e482]: "We evaluate the performance impact of the Mosaic Publisher across five visualization specifications (Figure 2) selected to represent a diverse range of interaction styles, view configurations, and query complexities. These include: airlines, a single-view chart with a filter slider and confidence interval overlays; property, a raster density plot with interactive regression fits; flights, a basic crossfiltering example with linked histograms; gaia and taxis, complex multi-view dashboards with high-resolution rasters and multiple coordinated selections. (Both the flights and gaia example are taken from the original Mosaic paper [11].) These examples cover both low and high cardinality selections, different types of interval filtering, and visualization types that stress different optimization paths."
          - paragraph [ref=f5e484]: ผู้วิจัยประเมิน Mosaic Publisher ด้วยข้อกำหนดภาพห้ารูปแบบ (Figure 2) ที่เลือกให้ครอบคลุมปฏิสัมพันธ์ การจัดมุมมอง และความซับซ้อนคิวรี ได้แก่ airlines ชาร์ตมุมมองเดียวที่มีแถบเลื่อนกรองและช่วงความเชื่อมั่นซ้อนทับ; property ภาพความหนาแน่นแบบแรสเตอร์พร้อมเส้นถดถอยที่ปรับตามการโต้ตอบ; flights ตัวอย่างกรองข้ามมุมมองด้วยฮิสโตแกรมที่เชื่อมกัน; gaia และ taxis แดชบอร์ดหลายมุมมองซับซ้อน มีแรสเตอร์ละเอียดสูงและการเลือกที่ประสานกันหลายแบบ flights และ gaia มาจากบทความ Mosaic เดิม [11] ตัวอย่างครอบคลุมการเลือกที่มีจำนวนค่าต่างกันมากและน้อย การกรองช่วงหลายแบบ และภาพที่ใช้เส้นทางปรับปรุงต่างกัน
        - generic [ref=f5e485]:
          - paragraph [ref=f5e487]: "To assess the effects of each optimization category (§3), we apply them incrementally: none performs all computation at runtime, +prep applies data preparation and projection rewrites, +cache further precomputes and stores both result caches and materialized aggregates for interaction updates, and +prerender adds initial pre-rendered visual outputs with hydration to enable interactivity. All benchmarks were run within Node.js v22.9.0 on a 2021 MacBook Pro laptop (14-inch, macOS 15.2) with an M1 Pro processor and 16GB RAM. The visualizations were hosted on a local server with DuckDB-WASM used as the backing database engine."
          - paragraph [ref=f5e489]: เพื่อประเมินแต่ละกลุ่ม (§3) ผู้วิจัยเพิ่มแนวทางทีละระดับ none คำนวณทุกอย่างตอนรันไทม์; +prep เตรียมข้อมูลและแก้การเลือกคอลัมน์; +cache เพิ่มการคำนวณและเก็บแคชผลลัพธ์กับผลรวมที่เก็บจริงเพื่ออัปเดตปฏิสัมพันธ์; +prerender เพิ่มภาพเริ่มต้นล่วงหน้าพร้อม hydration เพื่อให้โต้ตอบได้ Benchmark ทั้งหมดรันใน Node.js v22.9.0 บน MacBook Pro ปี 2021 ขนาด 14 นิ้ว macOS 15.2 ใช้ M1 Pro และ RAM 16GB ภาพเผยแพร่ผ่าน local server โดยมี DuckDB-WASM เป็นฐานข้อมูล
        - generic [ref=f5e490]:
          - paragraph [ref=f5e492]: Figure 3 confirms that without publish-time optimization, both TTR and TTA scale poorly with increasing data size—especially beyond one million rows—due to runtime query execution and rendering. Preparation alone (+prep) did not help the tested visualizations as they don’t involve preparatory transformation and don’t have extraneous columns; however, it is expected to provide more benefit for visualizations that operate over wide tables with many unvisualized columns or have non-trivial preparation queries. Pre-computing caches and aggregates (+cache) significantly reduces TTA, especially for datasets with 1M or more rows, enabling the system to respond more quickly to selection interactions. However, for smaller dataset sizes these assets can be computed quickly on-the-fly and optimization is not necessary. Pre-rendering (+prerender) consistently achieves the lowest TTR across all visualizations and dataset sizes, as rendering is performed entirely at publish time and loaded as static output (Figure 4).
          - paragraph [ref=f5e494]: Figure 3 ยืนยันว่าเมื่อไม่ปรับปรุงช่วงเผยแพร่ TTR และ TTA เพิ่มขึ้นมากตามขนาดข้อมูล โดยเฉพาะเกินหนึ่งล้านแถว เนื่องจากคิวรีและการวาดภาพตอนรันไทม์ +prep ไม่ช่วยตัวอย่างที่ทดสอบ เพราะไม่มีการแปลงเตรียมข้อมูลและไม่มีคอลัมน์เกินจำเป็น แต่คาดว่าจะช่วยได้มากขึ้นกับตารางกว้างที่มีคอลัมน์ไม่แสดงจำนวนมากหรือคิวรีเตรียมที่ซับซ้อน +cache ลด TTA ได้มาก โดยเฉพาะตั้งแต่ 1M แถว ทำให้ตอบการเลือกได้เร็วขึ้น แต่ข้อมูลเล็กสร้างทรัพยากรระหว่างใช้งานได้เร็วอยู่แล้ว จึงไม่จำเป็นต้องปรับปรุง การวาดล่วงหน้าหรือ +prerender ให้ TTR ต่ำสุดอย่างสม่ำเสมอทุกภาพและขนาดข้อมูล เพราะวาดทั้งหมดช่วงเผยแพร่และโหลดเป็นผลภาพสถิต (Figure 4)
