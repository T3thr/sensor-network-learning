        - generic [ref=f5e409]:
          - paragraph [ref=f5e411]: We developed Mosaic Publisher, a utility that analyzes visualization specifications, simulates interactions, and rewrites data definitions to reference precomputed assets. Specification rewrites occur automatically based on a user-selected optimization level, incrementally applying data preparation and projection, aggregate and cache pre-computation, and visualization pre-rendering. This design allows visualization designers to benefit from publish-time optimizations while retaining their original specifications.
          - paragraph [ref=f5e413]: ผู้วิจัยพัฒนา Mosaic Publisher เพื่อวิเคราะห์ข้อกำหนด จำลองปฏิสัมพันธ์ และแก้นิยามข้อมูลให้อ้างถึงทรัพยากรล่วงหน้า การแก้เกิดอัตโนมัติตามระดับที่เลือก โดยสะสมการเตรียมและเลือกคอลัมน์ การสร้างผลรวมกับแคช และการวาดภาพล่วงหน้า ผู้ออกแบบจึงใช้การปรับปรุงได้พร้อมรักษาข้อกำหนดเดิม
        - generic [ref=f5e414]:
          - paragraph [ref=f5e416]: "The publisher performs the following steps. Interaction Simulation: Programmatically activate interactors and inputs on a virtual DOM to trigger all queries that could be issued during runtime interaction. Query Materialization: Execute data preparation, initial loading, and pre-aggregation queries and save the results as deployable assets. AST Rewriting: Replace data preparation queries in a specification with references to precomputed results. Hydration Support: Emit JavaScript code to populate the Mosaic cache and database with pre-computed assets. For pre-rendered views, generate additional logic to initialize interactive components at runtime."
          - paragraph [ref=f5e418]: "Publisher ทำงานดังนี้ การจำลองปฏิสัมพันธ์: กระตุ้นตัวโต้ตอบและอินพุตบน Virtual DOM เพื่อเรียกคิวรีที่อาจเกิดตอนใช้งาน การเก็บผลคิวรี: รันคิวรีเตรียมข้อมูล โหลดครั้งแรก และผลรวมล่วงหน้า แล้วบันทึกเป็นทรัพยากรเผยแพร่ การแก้ AST: แทนคิวรีเตรียมข้อมูลด้วยจุดอ้างอิงผลที่คำนวณไว้ การรองรับ hydration: สร้าง JavaScript เติมแคช Mosaic และฐานข้อมูล สำหรับมุมมองที่วาดล่วงหน้า สร้างตรรกะเพิ่มเติมเพื่อเริ่มคอมโพเนนต์โต้ตอบตอนรันไทม์"
