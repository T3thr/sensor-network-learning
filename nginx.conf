# Nginx configuration for 305432 เครือข่ายเซนเซอร์ (Sensor Networks)
# Root Directory: /Users/3rapat/student/internship/CODEFIN/project/cwms/vahalla-wealth/private-docs/other-project/uni-work/senior-subject/sensor-network

worker_processes 1;
pid /Users/3rapat/student/internship/CODEFIN/project/cwms/vahalla-wealth/private-docs/other-project/uni-work/senior-subject/sensor-network/logs/nginx.pid;
error_log /Users/3rapat/student/internship/CODEFIN/project/cwms/vahalla-wealth/private-docs/other-project/uni-work/senior-subject/sensor-network/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /Users/3rapat/student/internship/CODEFIN/project/cwms/vahalla-wealth/private-docs/other-project/uni-work/senior-subject/sensor-network/logs/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for high performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 8080;
        server_name localhost;

        root /Users/3rapat/student/internship/CODEFIN/project/cwms/vahalla-wealth/private-docs/other-project/uni-work/senior-subject/sensor-network;
        index index.html;

        # Main portal
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # Paper 2 Story Validator
        location /paper-2/ {
            try_files $uri $uri/ /paper-2/index.html;
        }

        # Paper 3 Version 2
        location /paper-3/v2/ {
            try_files $uri $uri/ /paper-3/v2/index.html;
        }

        # Paper 3 Version 1
        location /paper-3/ {
            try_files $uri $uri/ /paper-3/index.html;
        }

        # Paper 4
        location /paper-4/ {
            try_files $uri $uri/ /paper-4/index.html;
        }

        # Cache static assets (CSS, JS, Images, Fonts)
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # PDF documents
        location ~* \.pdf$ {
            add_header Content-Disposition "inline";
        }

        error_page 404 /index.html;
    }
}
